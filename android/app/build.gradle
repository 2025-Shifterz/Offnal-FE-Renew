import groovy.json.JsonSlurper
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

ext {
    REACT_NATIVE_NODE_MODULES_DIR = rootProject.file("../node_modules/react-native")
    REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = rootProject.file("../node_modules/react-native-worklets")
}

def nodeBinary = System.getenv("NODE_BINARY")?.trim()

react {
    if (nodeBinary) {
        nodeExecutableAndArgs = [nodeBinary]
    }
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

project.ext.envConfigFiles = [
    developdebug: "env/.env.development",
    developrelease: "env/.env.development",
    productdebug: "env/.env.production",
    productrelease: "env/.env.production",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

def requiredEnvKeys = [
    "API_URL",
    "OPEN_API_URL",
    "OPEN_API_SERVICE_KEY",
    "KAKAO_NATIVE_APP_KEY",
    "KAKAO_REDIRECT_URI",
    "TERMS_OF_USE_URL",
    "PRIVACY_POLICY_URL",
]
def missingEnvKeys = requiredEnvKeys.findAll { key ->
    !project.env.get(key)?.toString()?.trim()
}

if (!missingEnvKeys.isEmpty()) {
    throw new GradleException("Missing required env keys: ${missingEnvKeys.join(', ')}")
}

def requestedGradleTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def isReleaseSigningRequired = requestedGradleTasks.any { task ->
    task.contains("productrelease") || task.contains("releas")
}
def requiredReleaseSigningProperties = [
    "OFFNAL_UPLOAD_STORE_FILE",
    "OFFNAL_UPLOAD_STORE_PASSWORD",
    "OFFNAL_UPLOAD_KEY_ALIAS",
    "OFFNAL_UPLOAD_KEY_PASSWORD",
]
def missingReleaseSigningProperties = requiredReleaseSigningProperties.findAll { key ->
    !project.findProperty(key)?.toString()?.trim()
}

if (isReleaseSigningRequired && !missingReleaseSigningProperties.isEmpty()) {
    throw new GradleException("Missing release signing properties: ${missingReleaseSigningProperties.join(', ')}")
}

def kakaoNativeAppKey = project.env.get("KAKAO_NATIVE_APP_KEY")
def kakaoScheme = kakaoNativeAppKey ? "kakao${kakaoNativeAppKey}" : "kakao"
def versionConfigFile = rootProject.file("../version.json")

if (!versionConfigFile.exists()) {
    throw new GradleException("Missing version.json at ${versionConfigFile}")
}

def versionConfig = new JsonSlurper().parse(versionConfigFile)
def appYearMonth = versionConfig.yearMonth?.toString()
def appBuildNumber = (versionConfig.buildNumber as Number).intValue()

if (!(appYearMonth ==~ /\d{4}\.\d{2}/)) {
    throw new GradleException("Invalid yearMonth in version.json: ${appYearMonth}")
}

if (appBuildNumber < 1 || appBuildNumber > 999) {
    throw new GradleException("Invalid buildNumber in version.json: ${appBuildNumber}")
}

def appVersionName = "${appYearMonth}.${appBuildNumber.toString().padLeft(3, '0')}"
def versionParts = appYearMonth.split("\\.")
def appVersionCode = versionParts[0].toInteger() * 100000 +
        versionParts[1].toInteger() * 1000 +
        appBuildNumber

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.shifterz.offnal"
    defaultConfig {
        applicationId "com.shifterz.offnal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        resValue "string", "kakao_app_key", kakaoNativeAppKey
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (missingReleaseSigningProperties.isEmpty()) {
                storeFile file(OFFNAL_UPLOAD_STORE_FILE)
                storePassword OFFNAL_UPLOAD_STORE_PASSWORD
                keyAlias OFFNAL_UPLOAD_KEY_ALIAS
                keyPassword OFFNAL_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            resValue "string", "app_name", "[Dev] Offnal"
            manifestPlaceholders = [
                usesCleartextTraffic: "true",
                kakaoScheme: kakaoScheme,
            ]
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            resValue "string", "app_name", "Offnal"
            manifestPlaceholders = [
                usesCleartextTraffic: "false",
                kakaoScheme: kakaoScheme,
            ]
        }
    }
    flavorDimensions "version"
    productFlavors {
        develop {
        }
        product {
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
